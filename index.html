<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARADOX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>PARADOX</h1>
      <p class="tagline">You are both the solution and the problem.</p>
      <div class="controls">Move: WASD / Arrows · Interact: E · Rewind: R · Reset: N</div>
    </header>

    <section class="hud">
      <div><strong>Level:</strong> <span id="levelName">-</span></div>
      <div><strong>Loops:</strong> <span id="loops">0</span></div>
      <div><strong>Status:</strong> <span id="status">Ready</span></div>
    </section>

    <canvas id="game" width="640" height="512" aria-label="Paradox game board"></canvas>

    <section class="message-box">
      <h2>Mission</h2>
      <p id="objective"></p>
      <p id="hint"></p>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
